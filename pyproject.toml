# Tool configuration. The app runs from source (python3 main.py ...);
# this file carries project metadata + the committed lint/test config so
# `make lint` / CI / local ruff / pytest all agree. Dependency floors live in
# requirements.txt (single source of truth — Kronos extras in
# requirements-kronos.txt).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-bot"
version = "1.3.0"
description = "Autonomous crypto/forex paper-trading bot with honest validation (purged-CV, PBO, Deflated Sharpe) and full decision attribution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["bot", "bot.strategies"]

[tool.ruff]
line-length = 100
exclude = ["models/kronos", "data", ".backup", ".venv", "venv"]

[tool.ruff.lint]
# ruff's default rule set (pyflakes + a subset of pycodestyle). The codebase's
# established idioms (blind-except boundaries, import order) are deliberately
# not policed here — this config pins the floor, not the style.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
