name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # core requirements only — torch/transformers are optional Kronos extras
      # (requirements-kronos.txt); the bot and the whole test suite run without them
      - run: pip install -r requirements.txt ruff==0.16.5
      - name: Verify (tests, lint, live/backtest parity — offline)
        run: make verify

  smoke:
    # import + CLI surface smoke: every subcommand must at least parse --help
    # (catches argparse wiring breaks the unit suite never imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: CLI smoke (every subcommand --help)
        run: |
          for cmd in backtest run hft-backtest hft-run hft-status hft-battery pause resume market validate dashboard status chat seed-demo kronos shadow; do
            python main.py "$cmd" --help || exit 1
          done
      - name: Battery scripts compile smoke
        run: python -m py_compile run_battery.py scripts/pinned_runs.py

  locked:
    # One complete, transitive lock proves the audit/reproduction path. The
    # matrix above intentionally keeps installing the floor file so supported
    # Python versions still catch dependency-floor and upgrade drift.
    # The interpreter must match the one requirements.lock was compiled with
    # (see its header) or the pinned set is not the resolved set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install fully pinned environment
        # ruff is a zero-dependency maintainer tool, pinned here rather than in
        # the application lock so it cannot perturb the pinned runtime set.
        run: pip install -r requirements.lock ruff==0.16.5
      - name: Verify the lock is the installed set
        run: pip check
      - name: Verify locked environment (offline)
        run: make verify
