id = "fade_thresholds"
kind = "study"
book = "fast"
tier = "perp"
created = 2026-10-01
note = "Re-run of a study first run on 2026-10-01 before pre-registration existed (docs/archive/HFT_TRADE_FREQUENCY.md). Declared with the same variants so every setting tried enters the registry."
hypothesis = "Looser fade thresholds raise trade frequency on 15 markets while keeping a profit factor above 1.0 after costs."
strategies = ["hft_exhaustion_fade"]
days = 90
holdout_days = 30   # variants are compared on the first 60 days (4 folds) and judged on the last 30
folds = 4

[[variants]]
name = "z2.0_vol2.0"
params = {hft_fade_z_entry = 2.0, hft_fade_vol_spike = 2.0}

