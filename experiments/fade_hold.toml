params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 2.0, hft_fade_time_stop = 36}

[[variants]]
name = "loose_plus2bp_6h"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 2.0, hft_fade_time_stop = 72}

[[variants]]
name = "loose_plus2bp_6h_entry_through_2bp"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 2.0, hft_fade_time_stop = 72, "hft.maker_penetration_bps" = 2.0}

