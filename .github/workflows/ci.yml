name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # core requirements only — torch/transformers are optional Kronos extras
      # (requirements-kronos.txt); the bot and the whole test suite run without them
      - run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check bot main.py config.py run_battery.py tests scripts
      - name: Tests (offline, network mocked)
        run: python -m pytest tests/ -q
