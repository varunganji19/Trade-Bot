id = "fade_limit_exit"
kind = "study"
book = "fast"
tier = "perp"
created = 2026-10-01
note = "Re-run of a study first run on 2026-10-01 before pre-registration existed (docs/archive/HFT_TRADE_FREQUENCY.md). Declared with the same variants so every setting tried enters the registry."
hypothesis = "A resting limit exit at the mean cuts the fade's round trip enough to make it profitable after costs."
strategies = ["hft_exhaustion_fade"]
days = 90
holdout_days = 30   # variants are compared on the first 60 days (4 folds) and judged on the last 30
folds = 4

[[variants]]
name = "live_market"
params = {}

[[variants]]
name = "live_touch"
params = {hft_fade_limit_exit_bps = 0.0}

[[variants]]
name = "live_plus2bp"
params = {hft_fade_limit_exit_bps = 2.0}

[[variants]]
name = "live_plus5bp"
params = {hft_fade_limit_exit_bps = 5.0}

[[variants]]
name = "loose_market"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5}

[[variants]]
name = "loose_touch"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 0.0}

[[variants]]
name = "loose_plus2bp"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 2.0}

[[variants]]
name = "loose_plus5bp"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 5.0}

[[variants]]
name = "loose_plus2bp_entry_through_2bp"
params = {hft_fade_z_entry = 2.25, hft_fade_vol_spike = 2.5, hft_fade_limit_exit_bps = 2.0, "hft.maker_penetration_bps" = 2.0}

